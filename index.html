<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ŞansX - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --neon-yellow: #ffe600;
      --neon-gold: #ffaa00;
      --dark-bg: #0a0a0c;
      --card-bg: #141419;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--dark-bg);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Qarşılama Animasiyası */
    #welcome-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(10px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeOut 0.8s ease 2.5s forwards;
    }
    .welcome-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      text-align: center;
      animation: zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .brand-yellow {
      color: var(--neon-yellow);
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
      font-weight: 900;
    }
    .brand-white { color: #ffffff; font-weight: 700; }

    /* Header */
    header {
      width: 100%;
      max-width: 480px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20, 20, 25, 0.8);
      border-bottom: 1px solid rgba(255, 230, 0, 0.2);
    }
    .user-info { font-size: 0.85rem; color: #aaa; }
    .jeton-box {
      background: #111;
      border: 2px solid var(--neon-yellow);
      border-radius: 20px;
      padding: 5px 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .jeton-count {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-yellow);
      font-weight: bold;
    }

    /* Düymələr */
    .btn-action {
      background: linear-gradient(45deg, var(--neon-gold), var(--neon-yellow));
      color: #000;
      font-weight: 800;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255, 230, 0, 0.3);
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }
    .btn-action:disabled {
      background: #444 !important;
      color: #888 !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }

    /* Çarx */
    .wheel-container {
      position: relative;
      margin: 25px 0;
      width: 330px;
      height: 330px;
    }
    #wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.2);
    }
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--neon-yellow);
      z-index: 10;
    }

    /* Haqqında */
    .info-section {
      width: 90%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin: 15px 0;
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }
    .social-link { display: block; color: var(--neon-yellow); font-weight: 600; margin-top: 8px; text-decoration: none; }

    @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>

  <div id="welcome-overlay">
    <div class="welcome-text">
      <span class="brand-yellow">ŞansX</span> <span class="brand-white">Xoş Gəldiniz</span>
    </div>
  </div>

  <header>
    <div class="user-info">İD: <span id="user-tg-id">Yüklənir...</span></div>
    <div class="jeton-box">
      <span>🪙</span>
      <span class="jeton-count" id="jeton-display">0</span>
    </div>
  </header>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
  </div>

  <button class="btn-action" id="spinBtn" onclick="spinWheel()">ÇARXI FİRLAT</button>
  <a href="https://t.me/sansxadmin" target="_blank" class="btn-action" style="background: #111; color: var(--neon-yellow); border: 1px solid var(--neon-yellow);">Jeton Al</a>

  <div class="info-section">
    <p><strong>Haqqımızda & Hüquqi Məlumat:</strong> Platformamız yerli və beynəlxalq qanunvericiliyin tələblərinə tam uyğun olaraq əyləncə məqsədilə fəaliyyət gösterir.</p>
    <a href="https://t.me/+LQVyKseQ6foxNGFh" target="_blank" class="social-link">📢 Rəsmi Telegram Kanalımıza Qoşulun</a>
  </div>

  <audio id="spinSound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
  <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
  <audio id="boomSound" src="https://assets.mixkit.co/active_storage/sfx/220/220-preview.mp3"></audio>

  <script>
    // 1. Firebase Konfiqurasiyası
    const firebaseConfig = { databaseURL: "https://ugur-8496e-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Telegram ID Təyini
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();
    let userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "TEST_USER_12345";
    document.getElementById('user-tg-id').innerText = userId;

    let userJeton = 0;

    // 3. İstifadəçi Məlumatı
    const userRef = db.ref('users/' + userId);
    userRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.banned) {
          document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50%;'>HESABINIZ BANLANIB!</h1>";
          return;
        }
        userJeton = data.jeton || 0;
        document.getElementById('jeton-display').innerText = userJeton;
      } else {
        userRef.set({ tgId: userId, jeton: 5, prizes: [], banned: false });
      }
    });

    // 4. Çarx Məlumatları (12 Balanslı Dilim)
    let prizes = [
      { label: "Redmi Note 14", chance: 0, color: "#ffe600", textColor: "#000", isBomb: false, img: "img/redmi.png" },
      { label: "BOMBA", chance: 95, color: "#141419", textColor: "#fff", isBomb: true, img: "img/bomba.png" },
      { label: "60 PUBG UC", chance: 0, color: "#ffe600", textColor: "#000", isBomb: false, img: "img/uc.png" },
      { label: "BOMBA", chance: 95, color: "#141419", textColor: "#fff", isBomb: true, img: "img/bomba.png" },
      { label: "500 Tiktok", chance: 0, color: "#ffe600", textColor: "#000", isBomb: false, img: "img/tiktok.png" },
      { label: "BOMBA", chance: 95, color: "#141419", textColor: "#fff", isBomb: true, img: "img/bomba.png" },
      { label: "5 Free Spin", chance: 40, color: "#ffe600", textColor: "#000", isBomb: false, img: "img/spin.png" },
      { label: "BOMBA", chance: 95, color: "#141419", textColor: "#fff", isBomb: true, img: "img/bomba.png" },
      { label: "20 AZN", chance: 0, color: "#ffe600", textColor: "#000", isBomb: false, img: "img/azn.png" },
      { label: "BOMBA", chance: 95, color: "#141419", textColor: "#fff", isBomb: true, img: "img/bomba.png" },
      { label: "5 Free Spin", chance: 40, color: "#ffe600", textColor: "#000", isBomb: false, img: "img/spin.png" },
      { label: "BOMBA", chance: 95, color: "#141419", textColor: "#fff", isBomb: true, img: "img/bomba.png" }
    ];

    // Admin Şanslarını Dinlə
    db.ref('settings/prizes').on('value', (snap) => {
      const data = snap.val();
      if (data) {
        data.forEach((p, i) => { if(prizes[i]) prizes[i].chance = p.chance; });
      }
    });

    // Şəkilləri Yüklə
    const loadedImages = {};
    prizes.forEach((p, idx) => {
      if (p.img) {
        let img = new Image();
        img.src = p.img;
        img.onload = () => drawWheel();
        loadedImages[idx] = img;
      }
    });

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const numSlices = prizes.length;
    const sliceAngle = (2 * Math.PI) / numSlices;
    let currentAngle = 0;
    let isSpinning = false;

    // Çarxı Çəkmək
    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < numSlices; i++) {
        const angle = currentAngle + i * sliceAngle;
        
        ctx.beginPath();
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 190, angle, angle + sliceAngle);
        ctx.fillStyle = prizes[i].color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#ffe600";
        ctx.stroke();

        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(angle + sliceAngle / 2);
        
        // Mətn
        ctx.textAlign = "right";
        ctx.fillStyle = prizes[i].textColor;
        ctx.font = "bold 12px Orbitron, sans-serif";
        ctx.fillText(prizes[i].label, 130, 4);

        // Şəkil (Mövcudsa)
        if (loadedImages[i] && loadedImages[i].complete && loadedImages[i].naturalWidth !== 0) {
          ctx.drawImage(loadedImages[i], 140, -10, 20, 20);
        }

        ctx.restore();
      }
    }

    // Çarxı Fırlatmaq
    function spinWheel() {
      if (isSpinning) return;
      if (userJeton < 1) {
        alert("Kifayət qədər jetonunuz yoxdur!");
        return;
      }

      // Spamın qarşısını almaq üçün DÜYMƏNİ DEAKTİV ET
      isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;

      // Jeton Azalt
      userJeton--;
      userRef.update({ jeton: userJeton });

      const spinSound = document.getElementById('spinSound');
      spinSound.currentTime = 0;
      spinSound.play();

      let selectedIndex = getWeightedPrizeIndex();

      let stopAngle = (3 * Math.PI / 2) - (selectedIndex * sliceAngle) - (sliceAngle / 2);
      let extraTurns = 7 * 2 * Math.PI; 
      let targetRotation = extraTurns + stopAngle;

      let startTime = null;
      let duration = 7000; // 7 Saniyə yavaşlama

      function animateSpin(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = (timestamp - startTime) / duration;

        if (progress < 1) {
          let easeOut = 1 - Math.pow(1 - progress, 4);
          currentAngle = easeOut * targetRotation;
          drawWheel();
          requestAnimationFrame(animateSpin);
        } else {
          currentAngle = targetRotation % (2 * Math.PI);
          drawWheel();
          isSpinning = false;
          spinBtn.disabled = false; // Düyməni yenidən aktiv et
          handleWin(prizes[selectedIndex]);
        }
      }
      requestAnimationFrame(animateSpin);
    }

    function getWeightedPrizeIndex() {
      let totalWeight = prizes.reduce((sum, p) => sum + p.chance, 0);
      let randomNum = Math.random() * totalWeight;
      let weightSum = 0;

      for (let i = 0; i < prizes.length; i++) {
        weightSum += prizes[i].chance;
        if (randomNum <= weightSum) return i;
      }
      return prizes.length - 1;
    }

    function handleWin(prize) {
      document.getElementById('spinSound').pause();

      if (prize.isBomb) {
        document.getElementById('boomSound').play();
        alert("💥 BOMBA çıxdı! Bəxtinizi bir daha sınayın.");
      } else {
        document.getElementById('winSound').play();
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        alert("🎉 TƏBRİKLƏR! Qazandınız: " + prize.label);
        
        userRef.child('prizes').push({
          prize: prize.label,
          date: new Date().toISOString()
        });
      }
    }

    drawWheel();
  </script>
</body>
</html>
